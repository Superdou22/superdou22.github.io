<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ergebnisse unserer Umfrage</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fafafa;
            color: #171717;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* Kreativer, weicher Mesh-Gradienten-Hintergrund (Hell) */
        .mesh-background {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: -1;
            background-color: #fafafa;
            background-image: 
                radial-gradient(at 0% 0%, rgba(224, 231, 255, 0.7) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(250, 232, 255, 0.6) 0px, transparent 50%),
                radial-gradient(at 50% 100%, rgba(240, 253, 244, 0.5) 0px, transparent 50%);
            opacity: 0.9;
        }

        /* Standard-Stile für die Karten (Mobil: Unsichtbare Box, nicht anklickbar) */
        .premium-card {
            background: transparent;
            border: none;
            border-radius: 0;
            padding: 0;
            box-shadow: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-sizing: border-box;
        }

        /* Desktop-Anpassung: Erst ab PCs und Tablets schaltet sich die edle Box & Klickbarkeit ein */
        @media (min-width: 768px) {
            .premium-card {
                background: rgba(255, 255, 255, 0.8);
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
                border: 1px solid rgba(255, 255, 255, 0.7);
                border-radius: 20px;
                padding: 24px;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.01), inset 0 1px 0 rgba(255, 255, 255, 0.8);
                transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
                cursor: pointer; /* Zeigt den Klick-Zeiger nur am PC */
            }
            
            @media (hover: hover) {
                .premium-card:hover {
                    transform: translateY(-6px) scale(1.02);
                    background: rgba(255, 255, 255, 0.98);
                    box-shadow: 0 40px 80px rgba(0, 0, 0, 0.08), 0 15px 40px rgba(99, 102, 241, 0.04);
                    border-color: rgba(99, 102, 241, 0.3);
                    z-index: 10;
                }
            }

            .premium-card:active {
                transform: scale(0.98);
                background: rgba(255, 255, 255, 0.95);
            }
        }

        header {
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 16px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        .logo {
            font-weight: 700;
            font-size: 18px;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, #4f46e5, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* --- Vollbild-Overlay (Lightbox, wird am PC genutzt) --- */
        .lightbox-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(9, 10, 15, 0.95);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .lightbox-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .lightbox-content {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 90%;
            max-width: 1300px;
            max-height: 85vh;
            position: relative;
        }

        .lightbox-img {
            max-width: 100%;
            max-height: 85vh;
            object-fit: contain;
            background: #ffffff;
            border-radius: 12px;
            padding: 12px;
            box-sizing: border-box;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .lightbox-close {
            position: absolute;
            top: -60px;
            right: 0;
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            font-size: 20px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 120;
        }
    </style>
</head>
<body>

    <div class="mesh-background"></div>

    <div id="lightbox" class="lightbox-overlay" onclick="closeLightbox()">
        <div class="lightbox-content" onclick="event.stopPropagation()">
            <button class="lightbox-close" onclick="closeLightbox()">✕</button>
            <img id="lightbox-img" src="" alt="Großansicht">
        </div>
    </div>

    <header>
        <div class="header-container">
            <div class="logo">Ergebnisse unserer Umfrage</div>
        </div>
    </header>
    <style>
        main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 16px 8px 40px 8px;
            width: 100%;
            box-sizing: border-box;
        }

        .large-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .screenshot-frame {
            background: #ffffff;
            border: 1px solid rgba(0, 0, 0, 0.05);
            border-radius: 8px;
            overflow: hidden;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            aspect-ratio: 16 / 9;
        }

        .screenshot-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 4px;
            box-sizing: border-box;
            display: block;
        }

        @media (min-width: 768px) {
            main { padding: 64px 32px 100px 32px; }
            .large-grid { grid-template-columns: repeat(2, 1fr); gap: 40px; }
            .screenshot-frame { border-radius: 14px; aspect-ratio: 16 / 8; }
            .screenshot-img { padding: 12px; }
        }
    </style>

    <main>
        <div class="large-grid">
            
            <!-- Feld 1: Alter -->
            <div class="premium-card" onclick="handleCardClick('Alter.png')">
                <div class="screenshot-frame">
                    <img src="Alter.png" alt="Alter" class="screenshot-img">
                </div>
            </div>

            <!-- Feld 2: Herkunft -->
            <div class="premium-card" onclick="handleCardClick('Herkunft.png')">
                <div class="screenshot-frame">
                    <img src="Herkunft.png" alt="Herkunft" class="screenshot-img">
                </div>
            </div>

            <!-- Feld 3: Häufigkeit -->
            <div class="premium-card" onclick="handleCardClick('Häufigkeit.png')">
                <div class="screenshot-frame">
                    <img src="Häufigkeit.png" alt="Häufigkeit" class="screenshot-img">
                </div>
            </div>

            <!-- Feld 4: Marken -->
            <div class="premium-card" onclick="handleCardClick('Marken.png')">
                <div class="screenshot-frame">
                    <img src="Marken.png" alt="Marken" class="screenshot-img">
                </div>
            </div>

            <!-- Feld 5: Faktoren -->
            <div class="premium-card" onclick="handleCardClick('Faktoren.png')">
                <div class="screenshot-frame">
                    <img src="Faktoren.png" alt="Faktoren" class="screenshot-img">
                </div>
            </div>

            <!-- Feld 6: Sitz der Marken -->
            <div class="premium-card" onclick="handleCardClick('Sitz der Marken.png')">
                <div class="screenshot-frame">
                    <img src="Sitz der Marken.png" alt="Sitz der Marken" class="screenshot-img">
                </div>
            </div>

            <!-- Feld 7: Bevorzugte Marke -->
            <div class="premium-card" onclick="handleCardClick('Bevorzugte Marke.png')">
                <div class="screenshot-frame">
                    <img src="Bevorzugte Marke.png" alt="Bevorzugte Marke" class="screenshot-img">
                </div>
            </div>

            <!-- Feld 8: Durchschnittliche Bewertung -->
            <div class="premium-card" onclick="handleCardClick('Durchschnittliche Bewertung.png')">
                <div class="screenshot-frame">
                    <img src="Durchschnittliche Bewertung.png" alt="Durchschnittliche Bewertung" class="screenshot-img">
                </div>
            </div>

        </div>
    </main>

    <script>
        // Prüft, ob es sich um ein Smartphone/Touch-Gerät handelt, oder ob eine Maus genutzt wird
        function handleCardClick(imageSrc) {
            const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
            
            // Wenn es kein Handy ist (Breite >= 768px UND keine reine Touch-Bedienung), öffne die Lightbox
            if (window.innerWidth >= 768 && !isTouchDevice) {
                openLightbox(imageSrc);
            }
        }

        function openLightbox(imageSrc) {
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            
            lightboxImg.src = imageSrc;
            lightbox.classList.add('active');
            
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            lightbox.classList.remove('active');
            
            document.body.style.overflow = '';
        }

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeLightbox();
            }
        });
    </script>

</body>
</html>
