<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ergebnisse unserer Umfrage</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fafafa;
            color: #171717;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Kreativer, weicher Mesh-Gradienten-Hintergrund (Hell) */
        .mesh-background {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: -1;
            background-color: #fafafa;
            background-image: 
                radial-gradient(at 0% 0%, rgba(224, 231, 255, 0.7) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(250, 232, 255, 0.6) 0px, transparent 50%),
                radial-gradient(at 50% 100%, rgba(240, 253, 244, 0.5) 0px, transparent 50%);
            opacity: 0.9;
        }

        /* Große, gläserne Premium-Karten */
        .premium-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.02), inset 0 1px 0 rgba(255, 255, 255, 0.8);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-sizing: border-box;
            cursor: pointer; /* Zeigt, dass die Box anklickbar ist */
        }

        .premium-card:hover {
            transform: translateY(-6px) scale(1.02);
            background: rgba(255, 255, 255, 0.98);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.08), 0 15px 40px rgba(99, 102, 241, 0.04);
            border-color: rgba(99, 102, 241, 0.3);
            z-index: 10;
        }

        header {
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 32px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        .logo {
            font-weight: 700;
            font-size: 22px;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, #4f46e5, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* --- Ultramodernes Vollbild-Overlay (Lightbox) --- */
        .lightbox-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(9, 10, 15, 0.9); /* Edles, tiefes Dunkel-Transparent */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        /* Wenn aktiv, wird das Overlay sichtbar */
        .lightbox-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .lightbox-content {
            max-width: 90%;
            max-height: 85%;
            position: relative;
            transform: scale(0.95);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .lightbox-overlay.active .lightbox-content {
            transform: scale(1);
        }

        .lightbox-img {
            max-width: 100%;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            background: #ffffff; /* Weißer Kernschatten für die Grafik */
            padding: 10px;
            box-sizing: border-box;
        }

        .lightbox-close {
            position: absolute;
            top: -50px;
            right: 0;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            font-size: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .lightbox-close:hover {
            background: #ffffff;
            color: #090a0f;
        }
    </style>
</head>
<body>

    <div class="mesh-background"></div>

    <!-- Vollbild-Lightbox Container -->
    <div id="lightbox" class="lightbox-overlay" onclick="closeLightbox()">
        <div class="lightbox-content" onclick="event.stopPropagation()">
            <button class="lightbox-close" onclick="closeLightbox()">✕</button>
            <img id="lightbox-img" src="" alt="Großansicht">
        </div>
    </div>

    <header>
        <div class="header-container">
            <div class="logo">Ergebnisse unserer Umfrage</div>
        </div>
    </header>
    <style>
        main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 64px 32px 100px 32px;
            width: 100%;
            box-sizing: border-box;
        }

        .large-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 40px;
        }

        .screenshot-frame {
            background: #ffffff;
            border: 1px solid rgba(0, 0, 0, 0.04);
            border-radius: 14px;
            overflow: hidden;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            aspect-ratio: 16 / 8; 
        }

        .screenshot-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 12px;
            box-sizing: border-box;
            display: block;
        }

        @media (max-width: 992px) {
            .large-grid { grid-template-columns: 1fr; gap: 32px; }
            .screenshot-frame { aspect-ratio: 16 / 9; }
        }
    </style>

    <main>
        <!-- Bei Klick auf eine Karte wird die Funktion openLightbox mit dem jeweiligen Pfad gestartet -->
        <div class="large-grid">
            
            <!-- Feld 1 -->
            <div class="premium-card" onclick="openLightbox('Alter.png')">
                <div class="screenshot-frame">
                    <img src="Alter.png" alt="Alter" class="screenshot-img">
                </div>
            </div>

            <!-- Feld 2 -->
            <div class="premium-card" onclick="openLightbox('Herkunft.png')">
                <div class="screenshot-frame">
                    <img src="Herkunft.png" alt="Herkunft" class="screenshot-img">
                </div>
            </div>

            <!-- Feld 3 -->
            <div class="premium-card" onclick="openLightbox('Häufigkeit.png')">
                <div class="screenshot-frame">
                    <img src="Häufigkeit.png" alt="Häufigkeit" class="screenshot-img">
                </div>
            </div>

            <!-- Feld 4 -->
            <div class="premium-card" onclick="openLightbox('Marken.png')">
                <div class="screenshot-frame">
                    <img src="Marken.png" alt="Marken" class="screenshot-img">
                </div>
            </div>

            <!-- Feld 5 -->
            <div class="premium-card" onclick="openLightbox('Faktoren.png')">
                <div class="screenshot-frame">
                    <img src="Faktoren.png" alt="Faktoren" class="screenshot-img">
                </div>
            </div>

            <!-- Feld 6 -->
            <div class="premium-card" onclick="openLightbox('Sitz der Marken.png')">
                <div class="screenshot-frame">
                    <img src="Sitz der Marken.png" alt="Sitz der Marken" class="screenshot-img">
                </div>
            </div>

            <!-- Feld 7 -->
            <div class="premium-card" onclick="openLightbox('Wichtigkeit Region.png')">
                <div class="screenshot-frame">
                    <img src="Wichtigkeit Region.png" alt="Wichtigkeit Region" class="screenshot-img">
                </div>
            </div>

            <!-- Feld 8 -->
            <div class="premium-card" onclick="openLightbox('Bevorzugte Marke.png')">
                <div class="screenshot-frame">
                    <img src="Bevorzugte Marke.png" alt="Bevorzugte Marke" class="screenshot-img">
                </div>
            </div>

            <!-- Feld 9 -->
            <div class="premium-card" onclick="openLightbox('Durchschnittliche Bewertung.png')">
                <div class="screenshot-frame">
                    <img src="Durchschnittliche Bewertung.png" alt="Durchschnittliche Bewertung" class="screenshot-img">
                </div>
            </div>

        </div>
    </main>

    <!-- Super-einfaches JavaScript für die Lightbox-Steuerung -->
    <script>
        function openLightbox(imageSrc) {
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            
            lightboxImg.src = imageSrc;
            lightbox.classList.add('active');
            
            // Verhindert das Scrollen im Hintergrund, wenn die Großansicht offen ist
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            lightbox.classList.remove('active');
            
            // Reaktiviert das Scrollen
            document.body.style.overflow = '';
        }

        // Erlaubt das Schließen der Großansicht per ESC-Taste auf der Tastatur
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeLightbox();
            }
        });
    </script>

</body>
</html>
