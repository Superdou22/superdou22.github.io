<!DOCTYPE html>
<html lang="de" data-theme="cyber-blue">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mein Spiel im Browser</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root[data-theme="cyber-blue"] { --bg: #050508; --card: rgba(15,18,28,0.75); --acc: #00f2fe; --pur: #4facfe; --font: 'Orbitron', sans-serif; --grid: 40px; --glow: 0 0 20px rgba(0,242,254,0.6); }
        :root[data-theme="acid-hacker"] { --bg: #020604; --card: rgba(5,15,10,0.85); --acc: #39ff14; --pur: #00ffaa; --font: 'Share Tech Mono', monospace; --grid: 20px; --glow: 0 0 15px rgba(57, 255, 20, 0.5); }
        :root[data-theme="synthwave"] { --bg: #0f051d; --card: rgba(30,15,45,0.75); --acc: #ff007f; --pur: #9d4edd; --font: 'VT323', monospace; --grid: 50px; --glow: 0 0 25px rgba(255,0,127,0.6); }
        :root[data-theme="crimson"] { --bg: #0a0202; --card: rgba(28,10,10,0.75); --acc: #ff003c; --pur: #ff6a00; --font: 'Orbitron', sans-serif; --grid: 30px; --glow: 0 0 20px rgba(255,0,60,0.6); }
        :root[data-theme="wasteland"] { --bg: #0e0f11; --card: rgba(24,26,30,0.85); --acc: #fcee0a; --pur: #ff0055; --font: monospace; --grid: 45px; --glow: 0 0 10px rgba(252,238,10,0.4); }
        :root[data-theme="ice-protocol"] { --bg: #050b14; --card: rgba(15,26,46,0.7); --acc: #00ffff; --pur: #70a1ff; --font: 'Orbitron', sans-serif; --grid: 60px; --glow: 0 0 20px rgba(0,255,255,0.5); }
        :root[data-theme="tokyo-neon"] { --bg: #060212; --card: rgba(20,12,38,0.75); --acc: #ff5e00; --pur: #e0115f; --font: 'Orbitron', sans-serif; --grid: 35px; --glow: 0 0 20px rgba(255,94,0,0.6); }
        :root[data-theme="luxury-gold"] { --bg: #030303; --card: rgba(18,17,15,0.85); --acc: #ffcc00; --pur: #b8860b; --font: 'Orbitron', sans-serif; --grid: 40px; --glow: 0 0 15px rgba(255,204,0,0.5); }

        html { scroll-behavior: smooth; overflow-y: scroll; }
        body { font-family: var(--font); background: var(--bg); color: #fff; margin:0; min-height:100vh; position:relative; transition: background 0.4s ease; }
        canvas { position:fixed; top:0; left:0; width:100%; height:100%; z-index:1; pointer-events:none; }
        .grid-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background-image: linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px); background-size: var(--grid) var(--grid); z-index:2; pointer-events:none; }
        
        .theme-switcher-container { position:fixed; top:20px; right:20px; z-index:10; }
        .theme-switcher { background:var(--card); border:1px solid var(--acc); color:#fff; padding:10px 15px; border-radius:8px; font-family:var(--font); cursor:pointer; font-weight:bold; outline:none; transition:0.3s ease; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
        .theme-switcher:hover, .theme-switcher:focus { box-shadow:var(--glow); border-color:#fff; }
        
        .glass-panel { background:var(--card); border:1px solid rgba(255,255,255,0.08); box-shadow:0 20px 50px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-radius:20px; }
        .hero-section { height:100vh; display:flex; justify-content:center; align-items:center; position:relative; z-index:3; padding:0 20px; box-sizing:border-box; }
        .content { text-align:center; width:100%; max-width:480px; padding:40px 30px; }
        
        h1 { font-size:2.8rem; font-weight:900; text-transform:uppercase; margin:0 0 5px 0; background:linear-gradient(135deg,#fff,var(--acc)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; letter-spacing:-0.02em; min-height:70px; }
        header p { color:var(--pur); font-weight:700; text-transform:uppercase; letter-spacing:0.25em; margin:0 0 35px 0; font-size:0.9rem; }
        .container { display:flex; flex-direction:column; gap:15px; }
        
        .btn { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:18px; color:#fff; text-decoration:none; border-radius:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.1em; font-size:0.95rem; border:1px solid rgba(255,255,255,0.1); background:rgba(255,255,255,0.03); transition:all 0.25s ease; }
        .btn-primary { background:linear-gradient(135deg,var(--pur),var(--acc)); color:#050508; border:none; font-weight:900; }
        .btn:hover { transform:translateY(-3px); border-color:var(--acc); box-shadow:var(--glow); }
        .btn-primary:hover { filter:brightness(1.1); box-shadow:var(--glow); }
        .btn-subtext { font-size: 0.65rem; text-transform: none; letter-spacing: 0; opacity: 0.6; margin-top: 4px; font-weight: normal; font-family: sans-serif; }

        .info-section { min-height:100vh; display:flex; justify-content:center; align-items:center; position:relative; z-index:3; padding:60px 20px; box-sizing:border-box; }
        .info-grid { display:grid; grid-template-columns:1fr 1fr; gap:40px; width:100%; max-width:1000px; padding:40px; align-items:center; }
        .screenshot-container { width:100%; border-radius:12px; overflow:hidden; border:1px solid rgba(255,255,255,0.1); box-shadow:var(--glow); aspect-ratio:16/9; background:#000; }
        .screenshot-container img { width:100%; height:100%; object-fit:cover; display:block; }
        .facts-container h2 { font-size:2.2rem; text-transform:uppercase; margin:0 0 20px 0; background:linear-gradient(135deg,#fff,var(--acc)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .facts-list { list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:15px; }
        .facts-list li { position:relative; padding-left:25px; font-size:1.1rem; line-height:1.6; color:#e0e0e0; }
        .facts-list li::before { content:"■"; position:absolute; left:0; top:0; color:var(--acc); font-size:0.9rem; text-shadow:var(--glow); }

        @media(max-width:768px) { .info-grid { grid-template-columns:1fr; gap:30px; padding:25px; } h1 { font-size:2.2rem; } }
    </style>
    <script src="coi-serviceworker.js" defer></script>
</head>
<body>

<div class="theme-switcher-container">
    <select id="themeSelect" class="theme-switcher">
        <option value="cyber-blue">Cyber Blue</option>
        <option value="acid-hacker">Acid Hacker</option>
        <option value="synthwave">Synthwave Night</option>
        <option value="crimson">Crimson Overdrive</option>
        <option value="wasteland">Wasteland Scrap</option>
        <option value="ice-protocol">Ice Protocol</option>
        <option value="tokyo-neon">Tokyo Neon</option>
        <option value="luxury-gold">Luxury Gold</option>
    </select>
</div>

<canvas id="particleCanvas"></canvas>
<div class="grid-overlay"></div>

<section class="hero-section">
    <main class="content glass-panel">
        <header>
            <h1 id="typingTitle">&nbsp;</h1>
            <p>System Online</p>
        </header>
        <nav class="container">
            <a href="Beta 0.4 Web.html" class="btn btn-primary">Jetzt Spielen (Beta 0.4)</a>
            </a>
        </nav>
    </main>
</section>

<section class="info-section">
    <div class="info-grid glass-panel">
        <div class="screenshot-container">
            <img src="Ingame%20Screenshot.png" alt="Ingame Screenshot">
        </div>
        <div class="facts-container">
            <h2>Game Features</h2>
            <ul class="facts-list">
                <li><strong>Projekt:</strong> Mein allererstes Spiel</li>
                <li><strong>Engine:</strong> Programmiert mit Godot</li>
                <li><strong>Umfang:</strong> Mit über 1500 Zeilen Code</li>
                <li><strong>Status:</strong> Mit ganz viel Liebe gemacht</li>
            </ul>
        </div>
    </div>
</section>

<script src="script.js" defer></script>
</body>
</html>
