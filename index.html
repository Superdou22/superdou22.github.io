<!DOCTYPE html>
<html lang="de" data-theme="cyber-blue">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mein Spiel im Browser</title>
    
    <!-- Google Fonts Import für alle Sci-Fi & Retro-Themes -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">

    <style>
        /* --- THEME-VARIABLEN --- */
        :root[data-theme="cyber-blue"] { 
            --bg: #050508; --card: rgba(15, 18, 28, 0.75); --acc: #00f2fe; --pur: #4facfe; 
            --font: 'Orbitron', sans-serif; --grid: 40px; --glow: 0 0 20px rgba(0, 242, 254, 0.6); 
        }
        :root[data-theme="acid-hacker"] { 
            --bg: #020604; --card: rgba(5, 15, 10, 0.85); --acc: #39ff14; --pur: #00ffaa; 
            --font: 'Share Tech Mono', monospace; --grid: 20px; --glow: 0 0 15px rgba(57, 255, 20, 0.5); 
        }
        :root[data-theme="synthwave"] { 
            --bg: #0f051d; --card: rgba(30, 15, 45, 0.75); --acc: #ff007f; --pur: #9d4edd; 
            --font: 'VT323', monospace; --grid: 50px; --glow: 0 0 25px rgba(255, 0, 127, 0.6); 
        }
        :root[data-theme="crimson"] { 
            --bg: #0a0202; --card: rgba(28, 10, 10, 0.75); --acc: #ff003c; --pur: #ff6a00; 
            --font: 'Orbitron', sans-serif; --grid: 30px; --glow: 0 0 20px rgba(255, 0, 60, 0.6); 
        }
        :root[data-theme="wasteland"] { 
            --bg: #0e0f11; --card: rgba(24, 26, 30, 0.85); --acc: #fcee0a; --pur: #ff0055; 
            --font: monospace; --grid: 45px; --glow: 0 0 10px rgba(252, 238, 10, 0.4); 
        }
        :root[data-theme="ice-protocol"] { 
            --bg: #050b14; --card: rgba(15, 26, 46, 0.7); --acc: #00ffff; --pur: #70a1ff; 
            --font: 'Orbitron', sans-serif; --grid: 60px; --glow: 0 0 20px rgba(0, 255, 255, 0.5); 
        }
        :root[data-theme="tokyo-neon"] { 
            --bg: #060212; --card: rgba(20, 12, 38, 0.75); --acc: #ff5e00; --pur: #e0115f; 
            --font: 'Orbitron', sans-serif; --grid: 35px; --glow: 0 0 20px rgba(255, 94, 0, 0.6); 
        }
        :root[data-theme="luxury-gold"] { 
            --bg: #030303; --card: rgba(18, 17, 15, 0.85); --acc: #ffcc00; --pur: #b8860b; 
            --font: 'Orbitron', sans-serif; --grid: 40px; --glow: 0 0 15px rgba(255, 204, 0, 0.5); 
        }

        /* --- BASIS LAYOUT --- */
        body { 
            font-family: var(--font); background: var(--bg); color: #fff; margin: 0; 
            height: 100vh; display: flex; justify-content: center; align-items: center; 
            overflow: hidden; position: relative; transition: background 0.4s ease; 
        }
        
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        
        .grid-overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background-image: linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px); 
            background-size: var(--grid) var(--grid); z-index: 2; pointer-events: none;
        }

        /* --- THEME-SWITCHER DROPDOWN --- */
        .theme-switcher-container { position: absolute; top: 20px; right: 20px; z-index: 10; }
        
        .theme-switcher { 
            background: var(--card); border: 1px solid var(--acc); color: #fff; 
            padding: 10px 15px; border-radius: 8px; font-family: var(--font); 
            cursor: pointer; font-weight: bold; outline: none; transition: 0.3s ease;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }
        .theme-switcher:hover, .theme-switcher:focus { box-shadow: var(--glow); border-color: #fff; }
        .theme-switcher option { background: #111; color: #fff; }

        /* --- CONTENT & CARD (Glasmorphismus) --- */
        .content { 
            position: relative; z-index: 3; text-align: center; width: 100%; 
            max-width: 480px; padding: 40px 30px; border-radius: 20px;
            background: var(--card); border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            transition: border-color 0.4s ease;
        }
        .content:hover { border-color: rgba(255, 255, 255, 0.15); }

        /* --- TYPOGRAFIE --- */
        h1 { 
            font-size: 2.8rem; font-weight: 900; text-transform: uppercase; margin: 0 0 5px 0; 
            background: linear-gradient(135deg, #fff, var(--acc)); -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5));
            letter-spacing: -0.02em; min-height: 70px; /* Verhindert das Springen des Menüs bei Textwechsel */
        }
        header p { 
            color: var(--pur); font-weight: 700; text-transform: uppercase; 
            letter-spacing: 0.25em; margin: 0 0 35px 0; font-size: 0.9rem;
            text-shadow: 0 0 10px rgba(255,255,255,0.1);
        }

        /* --- BUTTONS --- */
        .container { display: flex; flex-direction: column; gap: 15px; }
        
        .btn { 
            display: flex; align-items: center; justify-content: center; padding: 18px; 
            color: #fff; text-decoration: none; border-radius: 12px; font-weight: 700; 
            text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.95rem;
            border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(255, 255, 255, 0.03);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); position: relative; overflow: hidden;
        }
        
        /* Primärer Button (Spielen) */
        .btn-primary { 
            background: linear-gradient(135deg, var(--pur), var(--acc)); color: #050508; 
            border: none; font-weight: 900; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        /* Hover-Effekte */
        .btn:hover { transform: translateY(-3px); border-color: var(--acc); box-shadow: var(--glow); }
        .btn-primary:hover { filter: brightness(1.1); box-shadow: var(--glow), 0 6px 20px rgba(0,0,0,0.3); }
        .btn:active { transform: translateY(-1px); }
    </style>
    
    <script src="coi-serviceworker.js" defer></script>
</head>
<body>

<div class="theme-switcher-container">
    <label for="themeSelect" class="visually-hidden" style="display:none;">Theme wählen:</label>
    <select id="themeSelect" class="theme-switcher">
        <option value="cyber-blue">Cyber Blue</option>
        <option value="acid-hacker">Acid Hacker</option>
        <option value="synthwave">Synthwave Night</option>
        <option value="crimson">Crimson Overdrive</option>
        <option value="wasteland">Wasteland Scrap</option>
        <option value="ice-protocol">Ice Protocol</option>
        <option value="tokyo-neon">Tokyo Neon</option>
        <option value="luxury-gold">Luxury Gold</option>
    </select>
</div>

<canvas id="particleCanvas"></canvas>
<div class="grid-overlay"></div>

<main class="content">
    <header>
        <!-- Das Skript steuert diesen Textbereich an -->
        <h1 id="typingTitle">&nbsp;</h1>
        <p>System Online</p>
    </header>
    <nav class="container">
        <a href="Beta 0.4 Web.html" class="btn btn-primary">Jetzt Spielen (Beta 0.4)</a>
        <a href="Mode App Prototyp.html" class="btn">Mode App Prototyp</a>
    </nav>
</main>

<script src="script.js" defer></script>
</body>
</html>
